name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the deployment target; Linux keeps the core portable.
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,all]"

      - name: Lint
        run: .venv/bin/python -m ruff check src tests

      - name: Format check
        run: .venv/bin/python -m ruff format --check src tests

      - name: Type check
        run: .venv/bin/python -m mypy

      - name: Test
        run: .venv/bin/python -m pytest tests/ --cov=cortex --cov-report=term-missing

  privacy-gate:
    name: Privacy gate regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      # The security boundary gets its own required job so a failure here is
      # never buried in a matrix cell.
      - name: Assert private notes cannot reach a training provider
        run: .venv/bin/python -m pytest tests/test_router.py::TestPolicyGate -v

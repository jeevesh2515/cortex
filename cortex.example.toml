# Cortex configuration. Copy to ~/.config/cortex/cortex.toml and edit.
# API keys are NEVER stored here -- they come from environment variables.

vault_path = "~/Documents/Obsidian"

# Obsidian vault name, used to build clickable obsidian:// citation links.
# Defaults to the vault directory's own name, which is what Obsidian uses
# unless you renamed the vault in the app.
# vault_name = "MyVault"
# data_dir  = "~/.local/share/cortex"

# Hard switch: when true, nothing leaves this machine regardless of policy.
local_only = false

exclude_globs = [".obsidian/**", ".trash/**", ".git/**", "**/node_modules/**"]

[embedding]
model = "qwen3-embedding:0.6b"   # ~1.5 GB. Best quality-per-GB at 16 GB.
dimensions = 1024
ollama_url = "http://localhost:11434"

[retrieval]
top_k = 8
dense_k = 30
fts_k = 30
graph_enabled = true
graph_hops = 1
rerank_enabled = true          # needs: pip install 'cortex-brain[rerank]'
rerank_model = "bge-reranker-v2-m3"   # or "minilm" -- 4x faster, lower ceiling
rerank_candidates = 30
rerank_idle_ttl = 600.0        # release reranker weights after 10 min idle
temporal_enabled = true        # resolve "last week" and return full coverage
expansion_enabled = true       # strip filler words, run extra lexical variants
memory_max_results = 2         # cap memory notes per result set (see below)
fusion_weights = { dense = 1.0, fts = 0.8, graph = 0.5 }

# Also index PDFs, HTML clippings, EPUBs and .txt files.
# Needs: pip install 'cortex-brain[documents]'
ingest_documents = false

[memory]
# Cortex writes session notes as plain Markdown into your vault, wikilinked to
# the notes they drew on -- so memory shows up in graph view and you can edit or
# delete it in Obsidian like anything else.
enabled = true
folder = "Memory"
# Write a note after every `ask`. Off by default: capturing every passing
# question fills the vault with noise. Use `cortex ask --remember` instead.
auto = false

[chunking]
target_tokens = 512      # 2026 consensus; semantic chunking underperforms this
overlap_ratio = 0.10
min_tokens = 64          # floor guards against micro-fragments
max_tokens = 900

[thermal]
# Tuned for a fanless 16 GB Air. Raise on a machine with fans.
boost_workers = 4
nominal_workers = 2
throttled_workers = 1
critical_workers = 0
throttle_speed_limit = 95
critical_speed_limit = 60
min_battery_for_backfill = 30
sample_interval = 10.0

[serve]
# Settings for `cortex serve` -- the local web app (chat + voice + vault view).
# Defaults assume you only ever reach it from the same machine; bind 0.0.0.0
# only if you actually want other devices on the LAN talking to it, and then
# only on a trusted network. There is no auth -- this is a single-user tool.
host = "127.0.0.1"
port = 7331
open_browser = true
# cors_origins = ["http://localhost:7331", "http://localhost:5173"]  # add origins here

# Providers patch the shipped defaults -- name an existing one to override
# single fields, or give base_url + model to add a new endpoint.
#
# Shipped chain (priority is "lower sorts earlier"):
#   * ollama    -- local qwen3:4b. Hot path; ~no remote latency when the
#                 model is already resident. On Apple Silicon without the
#                 Metal JIT hang fix (``OLLAMA_NUM_GPU=0``), this is
#                 CPU-only -- still very fast for short completions.
#   * groq      -- llama-3.3-70b-versatile on the LPU. ~350 tok/s. Best
#                 quality-per-second at this tier; default for synthesis
#                 that doesn't fit the local context window.
#   * nvidia    -- Llama-3.3-70B-Instruct on NVIDIA NIM. Overflow when
#                 Groq is rate-limited; same capability, slower.
#   * openrouter -- llama-3.1-8b-instruct with the ZDR contract enforced
#                 on the wire. Pinned (not ``openrouter/free``) so the
#                 model identifier survives the weekly free roster
#                 rotation. ``meta-llama/*`` is one of the few model
#                 families consistently served by ZDR-endpoint providers
#                 on the lower credit tiers.
#
# On a fresh install, set the OPENROUTER ZDR contract before sending
# private notes through it:
#
# [[providers]]
# name = "openrouter"
# zdr_enabled = true      # ONLY after enabling zero-data-retention on your account
#
# To upgrade local hot-path capacity for a beefier machine, swap
# the ollama model here without touching the shipped defaults:
#
# [[providers]]
# name = "ollama"
# model = "qwen3:8b"
# priority = 0
#
# Adding a new endpoint (e.g. Cerebras) follows the same shape -- name
# anything not in the shipped chain and we append it:
#
# [[providers]]
# base_url = "https://api.cerebras.ai/v1"
# model = "llama-3.3-70b"
# policy = "no_train"
# api_key_env = "CEREBRAS_API_KEY"
# rpm = 30
# priority = 15

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-brain"
version = "0.1.0"
description = "Local-first second brain for Obsidian: hybrid retrieval with a thermal-aware indexer tuned for fanless Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jeevesh Singale" }]
keywords = ["rag", "obsidian", "second-brain", "mcp", "apple-silicon", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "watchdog>=4.0",
]

[project.optional-dependencies]
# Vector store. Kept optional so the core parser/chunker/router test suite
# runs anywhere, including CI images without native wheels.
index = ["lancedb>=0.29", "pyarrow>=16.0"]
# Local inference against an OpenAI-compatible endpoint (Ollama / mlx-lm).
mcp = ["mcp>=1.2"]
# Cross-encoder reranking. Pulls torch, so deliberately opt-in: on macOS this is
# the MPS wheel (a few hundred MB), not the multi-gigabyte CUDA build.
rerank = ["sentence-transformers>=3.0"]
# PDF / EPUB / HTML ingestion. pymupdf4llm emits markdown with headings intact,
# which the structure-aware chunker then splits properly.
documents = ["pymupdf4llm>=0.0.17"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]
all = ["cortex-brain[index,mcp,rerank,documents]"]

[project.scripts]
cortex = "cortex.cli:app"

[project.urls]
Homepage = "https://github.com/jeevesh2515/cortex"
Issues = "https://github.com/jeevesh2515/cortex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The exception hierarchy is rooted at ProviderError, which carries the suffix.
# Leaves read as conditions at the call site -- `except RateLimited` and
# `except PolicyViolation` are clearer than the -Error spellings.
"src/cortex/llm/protocol.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/cortex"]

[[tool.mypy.overrides]]
# numpy ships stubs whose `type` statements this mypy rejects when followed.
# Third-party internals are never our concern; skip following into them.
module = ["numpy.*", "sentence_transformers.*", "torch.*", "lancedb.*", "pyarrow.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires optional native deps (lancedb) or network",
]

[tool.coverage.run]
source = ["src/cortex"]
branch = true
